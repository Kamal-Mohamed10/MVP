[project]
name = "support-ticket-triage-mvp"
version = "0.1.0"
description = "A Flask-based support ticket triage MVP deployed on Vercel."
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "ticket_classifier"]
include-package-data = false

# Vercel will use api/index.py as the Python function entrypoint.
# Keep pyproject.toml for Python dependency resolution, but routing is handled by vercel.json.
